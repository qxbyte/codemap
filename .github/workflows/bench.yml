name: bench

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the Python version used to run benchmarks.
# Bumping a Python version means changing here, not at the use sites.
env:
  BENCH_PYTHON_VERSION: "3.13"

jobs:
  benchmark:
    name: benchmark vs main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
          # We don't commit `uv.lock`; key the cache on pyproject.toml instead
          # (the default `**/uv.lock` glob fails the action when no lockfile
          # exists in the checkout).
          cache-dependency-glob: "pyproject.toml"

      - name: Install Python
        run: uv python install ${{ env.BENCH_PYTHON_VERSION }}

      - name: Create venv and install
        run: |
          uv venv --python ${{ env.BENCH_PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run benchmarks on PR head
        run: |
          .venv/bin/python -m pytest tests/bench \
            -m bench \
            -o addopts="" \
            --benchmark-save=pr \
            --benchmark-json=bench-pr.json

      # Compare against main only on PRs; on push-to-main we just store the
      # numbers for future PRs.
      - name: Checkout main for baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main:main
          git stash --include-untracked
          git checkout main

      - name: Run benchmarks on main
        if: github.event_name == 'pull_request'
        run: |
          # `uv venv` does not bootstrap pip into the venv, so use
          # `uv pip install --python` instead of `.venv/bin/pip` (which
          # doesn't exist) to re-install the baseline.
          uv pip install --python .venv/bin/python -e ".[dev]"
          .venv/bin/python -m pytest tests/bench \
            -m bench \
            -o addopts="" \
            --benchmark-save=main \
            --benchmark-json=bench-main.json

      - name: Compare PR vs main
        if: github.event_name == 'pull_request'
        run: |
          .venv/bin/python -m pytest tests/bench \
            -m bench \
            -o addopts="" \
            --benchmark-compare=main \
            --benchmark-compare-fail=median:20%

      - name: Upload PR artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench-pr.json
            bench-main.json
          retention-days: 14
